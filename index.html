<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI & JU Anglo-Saxon International College</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-color: #eaf2eb;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #1b4324;
        }

        .page-container {
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(27, 67, 36, 0.12);
            border-top: 6px solid #1b4324;
        }

        /* HEADER STYLES */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            color: #1b4324;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 10px;
        }

        .contact-info a {
            color: #1b4324;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <header>
            <h1>PI & JU Anglo-Saxon International College</h1>
            <p class="contact-info">
                Tel : <a href="tel:+237677181569">+237 6 77 18 15 69</a> / <a href="tel:+237620514405">+237 6 20 51 44 05</a>
            </p>
        </header>
    </div>

</body>
</html>
