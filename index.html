<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texte Pleine Largeur</title>
  <style>
    /* Suppression des marges par défaut */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Section prenant toute la largeur */
    .full-width-section {
      width: 100vw;
      background-color: #2d5a27; /* Couleur de fond */
      color: #ffffff;            /* Couleur du texte */
      padding: 60px 20px;
      text-align: center;
    }

    /* Titre dont la taille varie selon la largeur de l'écran */
    .full-width-title {
      width: 100%;
      font-size: clamp(2rem, 8vw, 6rem); /* Taille dynamique */
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1.1;
      word-wrap: break-word;
    }

    /* Paragraphe sous le titre */
    .full-width-text {
      width: 100%;
      margin-top: 20px;
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <section class="full-width-section">
    <h1 class="full-width-title">VOTRE TITRE PLEINE LARGEUR</h1>
    <p class="full-width-text">
      Ajoutez ici votre texte. Grâce au CSS utilisé, ce contenu occupe toute la largeur disponible sur n'importe quel écran.
    </p>
  </section>

</body>
</html>
